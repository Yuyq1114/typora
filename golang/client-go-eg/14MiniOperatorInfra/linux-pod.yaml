apiVersion: v1
kind: Pod
metadata: {name: linux-isolation-lab, namespace: test1}
spec:
  securityContext:
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: shell
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests: {cpu: 50m, memory: 32Mi}
        limits: {cpu: 100m, memory: 64Mi}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
