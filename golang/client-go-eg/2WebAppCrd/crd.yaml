apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: webapps.demo.example.com
spec:
  group: demo.example.com
  scope: Namespaced
  names:
    plural: webapps
    singular: webapp
    kind: WebApp
    shortNames:
      - wa
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  minLength: 1
                replicas:
                  type: integer
                  format: int32
                  minimum: 0
                  default: 1
                port:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 65535
                  default: 80
          required:
            - spec
